<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>HydroCamel</title>

<style>
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f7f9fb;
  text-align: center;
  padding: 40px;
}

h1 { margin-bottom: 4px; }
.subtitle { color: #666; margin-bottom: 24px; }

.intake {
  font-size: 36px;
  font-weight: 700;
}

.camel-wrapper {
  position: relative;
  width: 280px;
  margin: 24px auto 8px;
}

.camel-wrapper img {
  width: 100%;
}

.float-text {
  position: absolute;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  font-weight: 700;
  color: #4fb6b8;
  animation: floatUp 1s ease-out forwards;
}

@keyframes floatUp {
  from { opacity: 1; transform: translate(-50%, 0); }
  to { opacity: 0; transform: translate(-50%, -40px); }
}

.heart {
  position: absolute;
  width: 24px;
  animation: pop 0.8s ease-out forwards;
}

@keyframes pop {
  from { opacity: 1; transform: scale(0.6); }
  to { opacity: 0; transform: scale(1.4) translateY(-30px); }
}

.status {
  min-height: 24px;
  margin-bottom: 20px;
  color: #444;
}

.controls {
  width: 260px;
  margin: 0 auto 16px;
}

button {
  background: #4fb6b8;
  color: white;
  border: none;
  padding: 14px 22px;
  border-radius: 12px;
  font-size: 16px;
  cursor: pointer;
}

.confetti {
  position: fixed;
  width: 8px;
  height: 8px;
  background: gold;
  animation: confettiFall 2s linear forwards;
}

@keyframes confettiFall {
  to { transform: translateY(100vh) rotate(360deg); opacity: 0; }
}
</style>
</head>

<body>

<h1>HydroCamel</h1>
<div class="subtitle">Smart hydration intelligence</div>

<div class="intake">
  <span id="currentMl">0</span> ml
  <div style="font-size:16px;color:#666;">
    of <span>2500</span> ml
  </div>
</div>

<div class="camel-wrapper" id="camelWrapper">
  <img id="camel" src="camel-normal.png" />
</div>

<div class="status" id="status">Start hydrating 💧</div>

<div class="controls">
  <input type="range" id="slider" min="100" max="500" step="50" value="300">
  <div><strong><span id="sliderVal">300</span> ml</strong></div>
</div>

<button onclick="drink()">Add water</button>

<script>
const GOAL = 2500;
let total = Number(localStorage.getItem("hydro-total")) || 0;

const camel = document.getElementById("camel");
const currentMl = document.getElementById("currentMl");
const status = document.getElementById("status");
const wrapper = document.getElementById("camelWrapper");
const slider = document.getElementById("slider");
const sliderVal = document.getElementById("sliderVal");

currentMl.textContent = total;

slider.oninput = () => sliderVal.textContent = slider.value;

function setCamel(src, time = 600) {
  camel.src = src;
  setTimeout(() => camel.src = "camel-normal.png", time);
}

function floatText(text) {
  const el = document.createElement("div");
  el.className = "float-text";
  el.textContent = text;
  wrapper.appendChild(el);
  setTimeout(() => el.remove(), 1000);
}

function heartPop() {
  const heart = document.createElement("img");
  heart.src = "heart.png";
  heart.className = "heart";
  heart.style.left = Math.random() * 80 + "px";
  wrapper.appendChild(heart);
  setTimeout(() => heart.remove(), 800);
}

function confetti() {
  for (let i = 0; i < 30; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 2000);
  }
}

function drink() {
  if (total >= GOAL) return;

  const amount = Number(slider.value);
  total += amount;
  if (total > GOAL) total = GOAL;

  localStorage.setItem("hydro-total", total);
  currentMl.textContent = total;

  floatText(`+${amount} ml`);

  if (total === GOAL) {
    setCamel("camel-kiss.png", 1200);
    status.textContent = "Goal achieved! 🎉";
    confetti();
  }
  else if (total % 500 === 0) {
    setCamel("camel-kiss.png");
    heartPop();
    status.textContent = "Nice hydration 😘";
  }
  else if (total / GOAL >= 0.75) {
    setCamel("camel-wink.png");
    status.textContent = "Almost there 😉";
  }
  else {
    setCamel("camel-blink.png");
    status.textContent = "Good rhythm. Keep going.";
  }
}
</script>

</body>
</html>
