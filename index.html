<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>HydroCamel</title>
<meta name="theme-color" content="#020c1b">

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">

<style>
/* ================= CORE THEME ================= */
:root {
  --bg: #020c1b;
  --bg-grad: linear-gradient(180deg,#020c1b,#081a33);
  --glass: rgba(255,255,255,.06);
  --glass-border: rgba(255,255,255,.18);
  --accent: #32c8ff;
  --text: #e0f4ff;
  --slider-track: rgba(255,255,255,.15);
}

[data-theme="light"] {
  --bg: #f4f8fb;
  --bg-grad: linear-gradient(180deg,#f4f8fb,#dbe9f4);
  --glass: rgba(255,255,255,.9);
  --glass-border: rgba(0,122,255,.2);
  --accent: #007aff;
  --text: #0a1a2f;
  --slider-track: rgba(0,0,0,.2);
}

html,body {
  margin:0;height:100%;background:var(--bg);overflow:hidden;
  font-family:'DM Sans',system-ui;color:var(--text);
}

#app {
  max-width:430px;margin:0 auto;height:100%;
  padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
  display:flex;flex-direction:column;gap:14px;
}

.syne { font-family:'Syne',sans-serif;font-weight:800;letter-spacing:-.5px }

/* ================= GLASS ================= */
.glass-card {
  background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.03));
  backdrop-filter:blur(20px);
  border:1px solid var(--glass-border);
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.15);
}

/* ================= HEADER ================= */
.header { display:flex;justify-content:space-between;align-items:center }

/* ================= ORB ================= */
.orb-box { flex:2.5;display:flex;justify-content:center;align-items:center }
.orb {
  width:160px;height:160px;border-radius:50%;
  border:3px solid var(--glass-border);
  position:relative;overflow:hidden;
  animation:breathe 6s ease-in-out infinite;
}
@keyframes breathe { 50%{transform:scale(1.02)} }

.orb-fill {
  position:absolute;bottom:0;width:100%;
  background:linear-gradient(180deg,#32c8ff,#005bd1);
  transition:height 1s cubic-bezier(.2,.8,.2,1);
  box-shadow:0 0 30px rgba(50,200,255,.6);
}
.orb-fill::after {
  content:"";position:absolute;top:-10px;left:-10%;
  width:120%;height:20px;background:rgba(255,255,255,.35);
  border-radius:50%;
}

.streak-ring {
  position:absolute;inset:-10px;border-radius:50%;
  border:4px solid transparent;border-top-color:var(--accent);
  transform:rotate(-90deg);opacity:0;
}

.streak-badge { font-size:10px;font-weight:800;letter-spacing:1px;opacity:.7 }

/* ================= STATS ================= */
.stats-grid { display:grid;grid-template-columns:repeat(3,1fr);gap:10px }
.stat-pill { text-align:center;padding:10px }
.stat-pill div:first-child { font-weight:800;font-size:16px }
.stat-pill div:last-child { font-size:9px;opacity:.6;letter-spacing:1px }

/* ================= AI COACH ================= */
.ai-card { padding:14px;font-size:13px;display:flex;gap:10px }
.ai-icon { font-size:18px }

/* ================= BUTTONS ================= */
.preset-grid { display:grid;grid-template-columns:1fr 1fr;gap:10px }
.preset-btn {
  padding:14px;text-align:center;font-weight:700;
  transition:transform .15s;
}
.preset-btn:active { transform:scale(.96) }

.random-box { margin-top:auto;padding:15px }
.log-btn {
  width:100%;padding:15px;border-radius:14px;border:none;
  background:var(--accent);color:#fff;font-weight:800;
}
.log-btn:active { transform:scale(.96) }

/* ================= RANGE ================= */
input[type=range] {
  width:100%;margin:15px 0;height:8px;
  background:var(--slider-track);border-radius:10px;
}

/* ================= CONFETTI ================= */
.confetti { position:fixed;inset:0;pointer-events:none;z-index:999 }
.confetti span {
  position:absolute;width:8px;height:14px;border-radius:2px;
  animation:fall 1.6s ease-out forwards;
}
@keyframes fall {
  to { transform:translateY(120vh) rotate(720deg);opacity:0 }
}

/* ================= WEEKLY REPORT ================= */
.report-overlay {
  position:fixed;inset:0;display:none;
  background:rgba(0,0,0,.45);
  backdrop-filter:blur(8px);
  z-index:2000;align-items:center;justify-content:center;
}
.report-card { width:90%;max-width:360px;padding:20px }
.report-row { font-size:13px;margin:6px 0 }
.report-close {
  width:100%;margin-top:14px;padding:12px;
  border:none;border-radius:12px;
  background:var(--accent);color:#fff;font-weight:800;
}
</style>
</head>

<body>
<div id="app">
  <div class="header">
    <div>
      <h1 class="syne" style="margin:0">HydroCamel</h1>
      <div id="dateLabel" style="font-size:11px;opacity:.6"></div>
    </div>
  </div>

  <div class="orb-box">
    <div class="orb">
      <div id="streakRing" class="streak-ring"></div>
      <div id="orbFill" class="orb-fill"></div>
      <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2">
        <span id="orbPct" class="syne" style="font-size:38px">0%</span>
        <span style="font-size:9px;letter-spacing:2px;font-weight:700">HYDRATED</span>
        <div id="streakLabel" class="streak-badge"></div>
      </div>
    </div>
  </div>

  <div class="stats-grid">
    <div class="glass-card stat-pill"><div id="statDrank">0ml</div><div>IN</div></div>
    <div class="glass-card stat-pill"><div id="statRemain">3.0L</div><div>LEFT</div></div>
    <div class="glass-card stat-pill" style="color:var(--accent)">
      <div id="statTarget">0ml</div><div>PER HR</div>
    </div>
  </div>

  <div id="aiCoach" class="glass-card ai-card">
    <div class="ai-icon">🧠</div>
    <div id="aiMsg">Loading hydration insight…</div>
  </div>

  <div class="preset-grid">
    <div class="glass-card preset-btn" onclick="addWater(250)">250ml</div>
    <div class="glass-card preset-btn" onclick="addWater(500)">500ml</div>
    <div class="glass-card preset-btn" onclick="addWater(750)">750ml</div>
    <div class="glass-card preset-btn" onclick="addWater(1000)">1L</div>
  </div>

  <div class="glass-card random-box">
    <strong id="rv">150ml</strong>
    <input type="range" min="50" max="600" step="10" value="150"
      oninput="rv.textContent=this.value+'ml'">
    <button class="log-btn" onclick="addWater(+rv.textContent.replace('ml',''))">
      LOG INTAKE
    </button>
  </div>
</div>

<!-- WEEKLY REPORT -->
<div id="weeklyReport" class="report-overlay">
  <div class="glass-card report-card">
    <div class="syne">📊 Weekly Hydration Report</div>
    <div id="reportBody"></div>
    <button class="report-close" onclick="weeklyReport.style.display='none'">Got it</button>
  </div>
</div>

<script>
/* ================= STATE ================= */
let st = JSON.parse(localStorage.getItem('hc')) || {
  goal:3, climate:'norm', wake:14, sleep:6, logs:[], streak:0
};

function save(){ localStorage.setItem('hc',JSON.stringify(st)) }
function addWater(ml){ st.logs.push({amount:ml,time:Date.now()}); save(); render() }

function render(){
  const now=new Date();
  document.getElementById('dateLabel').textContent =
    now.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});

  const drank=st.logs.reduce((a,b)=>a+b.amount,0);
  let goalMl=st.goal*1000*(st.climate==='hot'?1.2:1);
  const pct=Math.min(100,drank/goalMl*100);

  orbFill.style.height=pct+'%';
  orbPct.textContent=Math.round(pct)+'%';
  statDrank.textContent=drank+'ml';
  statRemain.textContent=((goalMl-drank)/1000).toFixed(1)+'L';

  aiMsg.innerHTML = drank<goalMl
    ? `💧 Aim for <strong>${Math.round((goalMl-drank)/4/50)*50}ml</strong> soon.`
    : `🎉 Goal reached. Light sips only.`;

  if(drank>=goalMl && !st.goalHit){
    st.goalHit=true; celebrate(); st.streak++; save();
  }
}

function celebrate(){
  const c=document.createElement('div');c.className='confetti';
  for(let i=0;i<40;i++){
    const s=document.createElement('span');
    s.style.left=Math.random()*100+'%';
    s.style.background=`hsl(${Math.random()*360},90%,60%)`;
    c.appendChild(s);
  }
  document.body.appendChild(c);
  setTimeout(()=>c.remove(),2000);
}

render();
</script>
</body>
</html>
