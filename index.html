<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HydroCamel</title>

<link rel="icon" href="icon-512.png" sizes="512x512">
<link rel="apple-touch-icon" href="icon-512.png">

<style>
:root{
  --bg:#f7f9fb;
  --text:#1f2937;
  --muted:#6b7280;
  --accent:#2bb0ed;
}

*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif}

body{
  margin:0;
  background:var(--bg);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  color:var(--text);
}

.app{
  width:100%;
  max-width:420px;
  padding:32px 24px 40px;
  text-align:center;
}

h1{margin:0;font-size:28px;font-weight:700}
.subtitle{margin-top:4px;color:var(--muted);font-size:14px}

.amount{margin-top:28px;font-size:42px;font-weight:800}
.goal{margin-top:6px;color:var(--muted);font-size:15px}

.camel-wrap{margin:30px 0 16px}
.camel{width:260px}

.message{font-size:14px;color:var(--muted)}

.add-water-btn{
  margin-top:26px;
  padding:14px;
  background:var(--accent);
  color:#fff;
  border-radius:14px;
  font-weight:600;
  cursor:pointer;
}

/* ===== MODAL ===== */
.modal{
  position:fixed;
  inset:0;
  background:var(--bg);
  display:none;
  z-index:10;
}

.modal.active{display:flex;justify-content:center;align-items:center}

.modal-inner{
  width:100%;
  max-width:420px;
  text-align:center;
}

/* ===== GLASSES ===== */
.stage{
  height:420px;
  display:flex;
  justify-content:center;
  align-items:flex-end;
  gap:50px;
}

.glass-wrap{
  transition:transform .35s ease,opacity .35s ease;
  cursor:pointer;
}

.glass-wrap.side{
  transform:scale(.68) translateY(60px);
  opacity:.55;
}

.glass{
  position:relative;
  width:140px;
  height:300px;
  border-radius:32px 32px 26px 26px;
  background:linear-gradient(90deg,
    rgba(255,255,255,.35),
    rgba(255,255,255,.05) 40%,
    rgba(255,255,255,.25)
  );
  border:3px solid rgba(43,176,237,.6);
  overflow:hidden;
}

/* rim */
.glass::before{
  content:"";
  position:absolute;
  top:-8px;
  left:14px;
  right:14px;
  height:16px;
  border-radius:50%;
  background:#fff;
  border:2px solid rgba(43,176,237,.55);
  z-index:3;
}

/* highlight */
.glass::after{
  content:"";
  position:absolute;
  top:14px;
  left:12px;
  width:14px;
  height:80%;
  background:rgba(255,255,255,.25);
  border-radius:10px;
  z-index:2;
}

.fill{
  position:absolute;
  bottom:0;
  width:100%;
  height:0%;
  background:linear-gradient(to top,#2bb0ed,#9be3ff);
  transition:height .15s cubic-bezier(.22,1,.36,1);
}

.fill::after{
  content:"";
  position:absolute;
  top:-8px;
  left:-10%;
  width:120%;
  height:16px;
  background:rgba(255,255,255,.4);
  border-radius:50%;
}

.ml{
  margin-top:16px;
  font-weight:600;
}

.confirm{
  margin-top:28px;
  padding:14px;
  background:var(--accent);
  color:#fff;
  border-radius:14px;
  font-weight:600;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="app">
  <h1>HydroCamel</h1>
  <div class="subtitle">Smart hydration intelligence</div>

  <div class="amount" id="total">0 ml</div>
  <div class="goal">of 2500 ml</div>

  <div class="camel-wrap">
    <img id="camel" class="camel" src="camel-normal.png">
  </div>

  <div class="message" id="message">Start hydrating 💧</div>

  <div class="add-water-btn" onclick="openModal()">+ Water</div>
</div>

<!-- ===== MODAL ===== -->
<div class="modal" id="modal">
  <div class="modal-inner">

    <div class="stage">
      <div class="glass-wrap active" data-max="500">
        <div class="glass"><div class="fill"></div></div>
        <div class="ml">0 ml selected</div>
      </div>

      <div class="glass-wrap side" data-max="1000">
        <div class="glass"><div class="fill"></div></div>
        <div class="ml">0 ml selected</div>
      </div>
    </div>

    <div class="confirm" onclick="confirmWater()">+ Water</div>
  </div>
</div>

<script>
const GOAL=2500;
let total=Number(localStorage.getItem("hydrocamel-total"))||0;
const totalEl=document.getElementById("total");
const camel=document.getElementById("camel");
const message=document.getElementById("message");

totalEl.textContent=total+" ml";

function openModal(){
  document.getElementById("modal").classList.add("active");
}

function closeModal(){
  document.getElementById("modal").classList.remove("active");
}

let active=document.querySelector(".active");
let selectedML=0;

document.querySelectorAll(".glass-wrap").forEach(g=>{
  g.addEventListener("click",()=>{
    if(g===active) return;
    active.classList.add("side");
    active.classList.remove("active");
    g.classList.remove("side");
    g.classList.add("active");
    active=g;
    selectedML=0;
    g.querySelector(".fill").style.height="0%";
    g.querySelector(".ml").textContent="0 ml selected";
  });

  g.addEventListener("pointermove",e=>{
    if(!g.classList.contains("active")||e.buttons!==1) return;
    const glass=g.querySelector(".glass");
    const fill=g.querySelector(".fill");
    const label=g.querySelector(".ml");
    const r=glass.getBoundingClientRect();
    let pct=(r.bottom-e.clientY)/r.height;
    pct=Math.max(0,Math.min(1,pct));
    fill.style.height=pct*100+"%";
    const max=g.dataset.max;
    selectedML=Math.round((pct*max)/10)*10;
    label.textContent=selectedML+" ml selected";
  });
});

function react(src,d=800){
  camel.src=src;
  setTimeout(()=>camel.src="camel-normal.png",d);
}

function confirmWater(){
  if(!selectedML) return;
  total=Math.min(GOAL,total+selectedML);
  totalEl.textContent=total+" ml";
  localStorage.setItem("hydrocamel-total",total);

  const reactions=["camel-blink.png","camel-happy.png","camel-kiss.png"];
  react(reactions[Math.floor(Math.random()*reactions.length)]);
  message.textContent="Nice hydration 💧";

  if(total>=GOAL){
    react("camel-wink.png",1200);
    message.textContent="Goal achieved 🎉";
  }

  closeModal();
}
</script>

</body>
</html>
