<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HydroCamel</title>

<link rel="icon" href="icon-512.png" sizes="512x512">
<link rel="apple-touch-icon" href="icon-512.png">

<style>
:root {
  --bg: #f7f9fb;
  --text: #1f2937;
  --muted: #6b7280;
  --accent: #2bb0ed;
}

* {
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
}

/* ---------- GLOBAL ---------- */

.screen {
  min-height: 100vh;
  padding: 24px 20px 32px;
}

.hidden {
  display: none;
}

button {
  cursor: pointer;
}

/* ---------- SETTINGS ICON ---------- */

.settings-btn {
  position: fixed;
  top: 18px;
  right: 18px;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: none;
  background: white;
  font-size: 20px;
  box-shadow: 0 6px 16px rgba(0,0,0,0.12);
  z-index: 20;
}

/* ---------- MAIN SCREEN ---------- */

.app {
  max-width: 420px;
  margin: 0 auto;
  text-align: center;
}

h1 {
  margin: 0;
  font-size: 28px;
}

.subtitle {
  font-size: 14px;
  color: var(--muted);
  margin-top: 4px;
}

.amount {
  margin-top: 24px;
  font-size: 42px;
  font-weight: 800;
}

.goal {
  font-size: 15px;
  color: var(--muted);
}

.camel-wrap {
  margin: 24px 0 12px;
  position: relative;
}

.camel {
  width: 220px;
  max-width: 70vw;
}

.message {
  font-size: 14px;
  color: var(--muted);
}

.slider-wrap {
  margin-top: 28px;
}

input[type="range"] {
  width: 100%;
}

.slider-value {
  margin-top: 8px;
  font-weight: 600;
}

.main-btn {
  margin-top: 18px;
  width: 100%;
  padding: 14px;
  border-radius: 14px;
  border: none;
  background: var(--accent);
  color: white;
  font-size: 16px;
  font-weight: 600;
}

/* ---------- SETTINGS SCREEN ---------- */

.settings-header {
  display: flex;
  align-items: center;
  gap: 12px;
}

.back-btn {
  border: none;
  background: none;
  font-size: 22px;
}

.settings-title {
  font-size: 20px;
  font-weight: 700;
}

.settings-list {
  margin-top: 24px;
}

.setting-item {
  background: white;
  padding: 16px;
  border-radius: 14px;
  margin-bottom: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.setting-item span {
  color: var(--muted);
  font-size: 14px;
}

/* ---------- FLOAT / HEART / CONFETTI ---------- */

.float {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  font-weight: 700;
  color: var(--accent);
  animation: floatUp 1s forwards;
}

@keyframes floatUp {
  from { opacity: 0; transform: translate(-50%, 10px); }
  to { opacity: 0; transform: translate(-50%, -40px); }
}
</style>
</head>

<body>

<!-- SETTINGS BUTTON -->
<button class="settings-btn" onclick="openSettings()">⚙️</button>

<!-- MAIN SCREEN -->
<div id="mainScreen" class="screen">
  <div class="app">
    <h1>HydroCamel</h1>
    <div class="subtitle">Smart hydration intelligence</div>

    <div class="amount" id="total">0 ml</div>
    <div class="goal">of 2500 ml</div>

    <div class="camel-wrap" id="camelWrap">
      <img id="camel" class="camel" src="camel-normal.png">
    </div>

    <div class="message" id="message">Start hydrating 💧</div>

    <div class="slider-wrap">
      <input type="range" min="100" max="500" step="50" id="slider">
      <div class="slider-value"><span id="sliderValue"></span> ml</div>
    </div>

    <button class="main-btn" onclick="addWater()">Add water</button>
  </div>
</div>

<!-- SETTINGS SCREEN -->
<div id="settingsScreen" class="screen hidden">
  <div class="settings-header">
    <button class="back-btn" onclick="closeSettings()">←</button>
    <div class="settings-title">Settings</div>
  </div>

  <div class="settings-list">
    <div class="setting-item">
      <div>Daily Goal</div>
      <span>2500 ml</span>
    </div>

    <div class="setting-item">
      <div>Daily Reset Time</div>
      <span>03:00 AM</span>
    </div>
  </div>
</div>

<script>
const GOAL = 2500;
let total = Number(localStorage.getItem("hydrocamel-total")) || 0;

const totalEl = document.getElementById("total");
const slider = document.getElementById("slider");
const sliderValue = document.getElementById("sliderValue");
const camel = document.getElementById("camel");
const message = document.getElementById("message");

slider.value = 300;
sliderValue.textContent = 300;
totalEl.textContent = total + " ml";

slider.oninput = () => sliderValue.textContent = slider.value;

function addWater() {
  const amount = Number(slider.value);
  total = Math.min(GOAL, total + amount);
  localStorage.setItem("hydrocamel-total", total);
  totalEl.textContent = total + " ml";

  camel.src = "camel-blink.png";
  setTimeout(() => camel.src = "camel-normal.png", 500);
}

function openSettings() {
  document.getElementById("mainScreen").classList.add("hidden");
  document.getElementById("settingsScreen").classList.remove("hidden");
}

function closeSettings() {
  document.getElementById("settingsScreen").classList.add("hidden");
  document.getElementById("mainScreen").classList.remove("hidden");
}
</script>

</body>
</html>
