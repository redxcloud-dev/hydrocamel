<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HydroCamel</title>

<link rel="icon" href="icon-512.png" sizes="512x512">
<link rel="apple-touch-icon" href="icon-512.png">

<style>
:root {
  --bg:#f7f9fb;
  --text:#1f2937;
  --muted:#6b7280;
  --accent:#2bb0ed;
}

*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif}

body{
  margin:0;
  background:var(--bg);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  color:var(--text);
}

.app{
  max-width:420px;
  width:100%;
  padding:24px;
  text-align:center;
  position:relative;
}

h1{margin:0;font-size:28px}
.subtitle{color:var(--muted);font-size:14px}

.amount{font-size:42px;font-weight:800;margin-top:24px}
.goal{color:var(--muted)}

.camel-wrap{margin:24px 0}
.camel{width:260px}

.message{font-size:14px;color:var(--muted)}

.add-water{
  margin-top:28px;
  display:flex;
  justify-content:center;
}

.water-btn{
  width:70px;
  height:100px;
  border-radius:18px;
  background:linear-gradient(#dff3ff,#b6e6ff);
  border:2px solid var(--accent);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:34px;
  font-weight:700;
  color:var(--accent);
  cursor:pointer;
}

/* ===== Intake Screen ===== */
.overlay{
  position:fixed;
  inset:0;
  background:#fff;
  z-index:10;
  display:none;
  flex-direction:column;
}

.header{
  padding:16px;
  text-align:left;
  font-size:18px;
  font-weight:600;
}

.back{cursor:pointer}

.glasses{
  flex:1;
  display:flex;
  justify-content:space-around;
  align-items:flex-end;
  padding:40px 20px;
}

.glass{
  width:120px;
  height:260px;
  border-radius:20px;
  border:3px solid var(--accent);
  position:relative;
  overflow:hidden;
  touch-action:none;
}

.fill{
  position:absolute;
  bottom:0;
  width:100%;
  height:0%;
  background:linear-gradient(#2bb0ed,#6dd5ff);
  transition:height .1s;
}

.label{
  position:absolute;
  top:-32px;
  width:100%;
  font-weight:600;
}

.add-btn{
  margin:24px;
  padding:14px;
  border-radius:12px;
  background:var(--accent);
  color:#fff;
  font-size:16px;
  border:none;
}
</style>
</head>

<body>

<div class="app">
  <h1>HydroCamel</h1>
  <div class="subtitle">Smart hydration intelligence</div>

  <div class="amount" id="total">0 ml</div>
  <div class="goal">of 2500 ml</div>

  <div class="camel-wrap">
    <img id="camel" class="camel" src="camel-normal.png">
  </div>

  <div class="message" id="message">Stay hydrated 💧</div>

  <div class="add-water">
    <div class="water-btn" onclick="openIntake()">+</div>
  </div>
</div>

<!-- Intake Overlay -->
<div class="overlay" id="overlay">
  <div class="header"><span class="back" onclick="closeIntake()">← Back</span></div>

  <div class="glasses">
    <div class="glass" data-max="500">
      <div class="label"><span id="ml1">0</span> ml</div>
      <div class="fill" id="fill1"></div>
    </div>

    <div class="glass" data-max="1000">
      <div class="label"><span id="ml2">0</span> ml</div>
      <div class="fill" id="fill2"></div>
    </div>
  </div>

  <button class="add-btn" onclick="commitWater()">+ Add water</button>
</div>

<script>
const GOAL=2500;
let total=+localStorage.getItem("total")||0;
let selected=0;

const camel=document.getElementById("camel");
const message=document.getElementById("message");
const totalEl=document.getElementById("total");

totalEl.textContent=total+" ml";

function openIntake(){
  selected=0;
  document.getElementById("overlay").style.display="flex";
  resetGlasses();
}

function closeIntake(){
  document.getElementById("overlay").style.display="none";
}

function resetGlasses(){
  ["fill1","fill2"].forEach(id=>document.getElementById(id).style.height="0%");
  ml1.textContent=0; ml2.textContent=0;
}

document.querySelectorAll(".glass").forEach((glass,i)=>{
  let fill=glass.querySelector(".fill");
  let label=glass.querySelector("span");

  glass.addEventListener("pointermove",e=>{
    if(!e.buttons) return;
    const rect=glass.getBoundingClientRect();
    let pct=(rect.bottom-e.clientY)/rect.height;
    pct=Math.max(0,Math.min(1,pct));
    fill.style.height=pct*100+"%";
    let ml=Math.round(pct*glass.dataset.max/10)*10;
    label.textContent=ml;
    selected=i===0?ml:0;
    if(i===1) selected=ml;
  });
});

function commitWater(){
  if(!selected) return;
  total=Math.min(GOAL,total+selected);
  totalEl.textContent=total+" ml";
  localStorage.setItem("total",total);
  react();
  closeIntake();
}

function react(){
  const reactions=[
    ["camel-blink.png","Nice sip 💧"],
    ["camel-kiss.png","Camel loves you ❤️"],
    ["camel-wink.png","Keep going 😉"]
  ];
  const r=reactions[Math.floor(Math.random()*reactions.length)];
  camel.src=r[0];
  message.textContent=r[1];
  setTimeout(()=>camel.src="camel-normal.png",700);
}
</script>

</body>
</html>
