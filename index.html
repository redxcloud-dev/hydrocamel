<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="manifest" href="/hydrocamel/manifest.json">

  <title>HydroCamel</title>

  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b1220;
      --card: #020617;
      --accent: #38bdf8;
      --text: #e5e7eb;
      --muted: #94a3b8;
    }

    :root.light {
      --bg: #f8fafc;
      --card: #ffffff;
      --accent: #0284c7;
      --text: #020617;
      --muted: #475569;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "DM Sans", system-ui, sans-serif;
      background: linear-gradient(180deg, var(--bg), var(--card));
      color: var(--text);
    }

    header {
      padding: 28px 20px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 460px;
      margin: 0 auto;
    }

    header h1 {
      font-family: "Syne", sans-serif;
      font-size: 2.2rem;
      margin: 0;
    }

    header p {
      color: var(--muted);
      margin: 4px 0 0;
      font-size: 0.95rem;
    }

    .title {
      text-align: left;
    }

    #themeToggle {
      background: var(--card);
      border: 1px solid var(--muted);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.9rem;
      cursor: pointer;
    }

    main {
      max-width: 460px;
      margin: 0 auto;
      padding: 12px;
      display: grid;
      gap: 16px;
    }

    .card {
      background: linear-gradient(180deg, var(--card), rgba(0,0,0,0.2));
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      border: 1px solid rgba(255,255,255,0.05);
    }

    .card h2 {
      font-family: "Syne", sans-serif;
      font-size: 1.2rem;
      margin: 0 0 12px;
    }

    .progress {
      width: 100%;
      height: 12px;
      background: rgba(0,0,0,0.25);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress span {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #22d3ee);
      transition: width 0.4s ease;
    }

    .stat {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    button {
      width: 100%;
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(135deg, #38bdf8, #22d3ee);
      color: #020617;
      margin-top: 10px;
    }

    .goal-buttons button {
      margin-top: 8px;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--muted);
    }

    .goal-buttons button.active {
      background: linear-gradient(135deg, #38bdf8, #22d3ee);
      color: #020617;
    }

    input[type="range"] {
      width: 100%;
      margin-top: 10px;
    }

    .ai {
      font-size: 0.95rem;
      line-height: 1.5;
    }

    footer {
      text-align: center;
      padding: 28px 10px;
      font-size: 0.75rem;
      color: var(--muted);
    }
  </style>
</head>

<body>

<header>
  <div class="title">
    <h1>HydroCamel</h1>
    <p>Smart hydration intelligence</p>
  </div>
  <button id="themeToggle">🌙 Dark</button>
</header>

<main>

  <div class="card">
    <h2>Daily Goal</h2>

    <div class="goal-buttons">
      <button data-goal="2000">2000 ml · Light</button>
      <button data-goal="2500">2500 ml · Normal</button>
      <button data-goal="3000">3000 ml · Active</button>
    </div>

    <input type="range" min="1500" max="4000" step="250" id="customGoal">
    <div class="stat">
      <span>Custom goal</span>
      <span id="goalValue">2500 ml</span>
    </div>
  </div>

  <div class="card">
    <h2>Today’s Hydration</h2>

    <div class="progress">
      <span id="progressBar"></span>
    </div>

    <div class="stat">
      <span id="amountText">0 ml</span>
      <span id="goalText">Goal: 2500 ml</span>
    </div>

    <button id="drinkBtn">+ Drink 250 ml</button>
  </div>

  <div class="card">
    <h2>AI Hydration Insight</h2>
    <div class="ai" id="aiText"></div>
  </div>

  <div class="card">
    <h2>Weekly Intelligence Report</h2>
    <div class="ai" id="weeklyText"></div>
  </div>

</main>

<footer>
  Built with 💧 discipline · Works offline
</footer>

<script>
  const root = document.documentElement;
  const toggle = document.getElementById("themeToggle");

  const saved = localStorage.getItem("theme");
  const prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;

  if (saved === "light" || (!saved && prefersLight)) {
    root.classList.add("light");
    toggle.textContent = "☀️ Light";
  }

  toggle.onclick = () => {
    const light = root.classList.toggle("light");
    localStorage.setItem("theme", light ? "light" : "dark");
    toggle.textContent = light ? "☀️ Light" : "🌙 Dark";
  };

  const STEP = 250;
  const todayKey = new Date().toISOString().slice(0,10);
  const data = JSON.parse(localStorage.getItem("hydration") || "{}");
  data[todayKey] = data[todayKey] || 0;

  let GOAL = Number(localStorage.getItem("goal")) || 2500;

  const progressBar = document.getElementById("progressBar");
  const amountText = document.getElementById("amountText");
  const goalText = document.getElementById("goalText");
  const aiText = document.getElementById("aiText");
  const weeklyText = document.getElementById("weeklyText");
  const drinkBtn = document.getElementById("drinkBtn");
  const goalButtons = document.querySelectorAll(".goal-buttons button");
  const customGoal = document.getElementById("customGoal");
  const goalValue = document.getElementById("goalValue");

  function setGoal(value) {
    GOAL = value;
    localStorage.setItem("goal", value);
    goalText.textContent = `Goal: ${value} ml`;
    goalValue.textContent = `${value} ml`;
    customGoal.value = value;

    goalButtons.forEach(b =>
      b.classList.toggle("active", Number(b.dataset.goal) === value)
    );

    updateUI(data[todayKey]);
  }

  function updateUI(amount) {
    const percent = Math.min((amount / GOAL) * 100, 100);
    progressBar.style.width = percent + "%";
    amountText.textContent = `${amount} ml`;

    if (amount < GOAL * 0.4) aiText.textContent = "You’re under your hydration curve. Sip steadily.";
    else if (amount < GOAL * 0.8) aiText.textContent = "Good pace. Keep spreading intake.";
    else if (amount < GOAL) aiText.textContent = "Almost there. One more glass.";
    else aiText.textContent = "Goal achieved. Excellent hydration.";
  }

  function updateWeekly() {
    const days = Object.values(data);
    if (days.length < 3) {
      weeklyText.textContent = "Log a few more days to unlock insights.";
      return;
    }
    const avg = Math.round(days.reduce((a,b)=>a+b,0)/days.length);
    weeklyText.textContent = `Average intake: ${avg} ml/day.`;
  }

  drinkBtn.onclick = () => {
    data[todayKey] += STEP;
    localStorage.setItem("hydration", JSON.stringify(data));
    updateUI(data[todayKey]);
    updateWeekly();
  };

  goalButtons.forEach(b => b.onclick = () => setGoal(Number(b.dataset.goal)));
  customGoal.oninput = e => setGoal(Number(e.target.value));

  setGoal(GOAL);
  updateWeekly();
</script>

</body>
</html>
