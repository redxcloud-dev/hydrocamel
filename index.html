<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="/hydrocamel/manifest.json">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HydroCamel</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">

  <!-- PWA -->
  <meta name="theme-color" content="#0f172a" />

  <style>
    :root {
      --bg: #0f172a;
      --card: #020617;
      --accent: #38bdf8;
      --text: #e5e7eb;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "DM Sans", system-ui, sans-serif;
      background: radial-gradient(1200px 600px at top, #0b1225, var(--bg));
      color: var(--text);
      min-height: 100vh;
    }

    header {
      padding: 24px 20px;
      text-align: center;
    }

    header h1 {
      font-family: "Syne", sans-serif;
      font-size: 2.2rem;
      margin: 0;
      letter-spacing: 0.5px;
    }

    header p {
      color: var(--muted);
      margin-top: 6px;
      font-size: 0.95rem;
    }

    main {
      max-width: 460px;
      margin: 0 auto;
      padding: 12px;
      display: grid;
      gap: 16px;
    }

    .card {
      background: linear-gradient(180deg, #020617, #020617cc);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      border: 1px solid #020617;
    }

    .card h2 {
      font-family: "Syne", sans-serif;
      font-size: 1.2rem;
      margin: 0 0 10px 0;
    }

    .progress-wrap {
      margin-top: 10px;
    }

    .progress {
      width: 100%;
      height: 12px;
      background: #020617;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress span {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #22d3ee);
      transition: width 0.4s ease;
    }

    .stat {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    button {
      width: 100%;
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(135deg, #38bdf8, #22d3ee);
      color: #020617;
      margin-top: 10px;
    }

    button:active {
      transform: scale(0.98);
    }

    .ai {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #e2e8f0;
    }

    footer {
      text-align: center;
      padding: 24px 10px;
      font-size: 0.75rem;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <header>
    <h1>HydroCamel</h1>
    <p>Smart hydration intelligence</p>
  </header>

  <main>
    <div class="card">
      <h2>Today’s Hydration</h2>

      <div class="progress-wrap">
        <div class="progress">
          <span id="progressBar"></span>
        </div>
      </div>

      <div class="stat">
        <span id="amountText">0 ml</span>
        <span>Goal: 2500 ml</span>
      </div>

      <button id="drinkBtn">+ Drink 250 ml</button>
    </div>

    <div class="card">
      <h2>AI Hydration Insight</h2>
      <div class="ai" id="aiText">
        Loading hydration intelligence…
      </div>
    </div>

    <div class="card">
      <h2>Weekly Intelligence Report</h2>
      <div class="ai" id="weeklyText">
        Start logging to unlock insights.
      </div>
    </div>
  </main>

  <footer>
    Built with 💧 discipline · Works offline
  </footer>

  <script>
    const GOAL = 2500;
    const STEP = 250;

    const progressBar = document.getElementById("progressBar");
    const amountText = document.getElementById("amountText");
    const aiText = document.getElementById("aiText");
    const weeklyText = document.getElementById("weeklyText");
    const drinkBtn = document.getElementById("drinkBtn");

    const todayKey = new Date().toISOString().slice(0, 10);

    function loadData() {
      const data = JSON.parse(localStorage.getItem("hydration") || "{}");
      return data;
    }

    function saveData(data) {
      localStorage.setItem("hydration", JSON.stringify(data));
    }

    function updateUI(amount) {
      const percent = Math.min((amount / GOAL) * 100, 100);
      progressBar.style.width = percent + "%";
      amountText.textContent = amount + " ml";

      if (amount < 1000) {
        aiText.textContent = "You’re under-hydrated. Start sipping regularly.";
      } else if (amount < 2000) {
        aiText.textContent = "Good progress. Keep steady intake through the day.";
      } else if (amount < GOAL) {
        aiText.textContent = "Almost there. One or two more glasses will do it.";
      } else {
        aiText.textContent = "Excellent. You’ve reached optimal hydration today.";
      }
    }

    function updateWeekly(data) {
      const days = Object.values(data);
      if (days.length < 3) {
        weeklyText.textContent = "Not enough data yet. Keep logging daily.";
        return;
      }

      const avg = Math.round(days.reduce((a,b) => a + b, 0) / days.length);
      weeklyText.textContent =
        "Your average intake is " + avg + " ml/day. " +
        (avg >= GOAL
          ? "Consistency is strong. Maintain this habit."
          : "Try increasing intake gradually for better balance.");
    }

    const data = loadData();
    data[todayKey] = data[todayKey] || 0;

    updateUI(data[todayKey]);
    updateWeekly(data);

    drinkBtn.addEventListener("click", () => {
      data[todayKey] += STEP;
      saveData(data);
      updateUI(data[todayKey]);
      updateWeekly(data);
    });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/hydrocamel/sw.js");
    }
  </script>

</body>
</html>
