<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="manifest" href="/hydrocamel/manifest.json">

  <title>HydroCamel</title>

  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
  --bg: #0b1220;
  --card: #020617;
  --accent: #38bdf8;
  --text: #e5e7eb;
  --muted: #94a3b8;
}

:root.light {
  --bg: #f8fafc;
  --card: #ffffff;
  --accent: #0284c7;
  --text: #020617;
  --muted: #475569;
}

    * { box-sizing: border-box; }

    html {
      height: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      font-family: "DM Sans", system-ui, sans-serif;
      background: linear-gradient(180deg, var(--bg), var(--card));
      color: var(--text);
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    header {
      padding: 28px 20px 20px;
      text-align: center;
    }

    header h1 {
      font-family: "Syne", sans-serif;
      font-size: 2.2rem;
      margin: 0;
    }

    header p {
      color: var(--muted);
      margin-top: 6px;
      font-size: 0.95rem;
    }

    main {
      max-width: 460px;
      margin: 0 auto;
      padding: 12px;
      display: grid;
      gap: 16px;
    }

    .card {
      background: linear-gradient(180deg, #020617, #020617cc);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      border: 1px solid #020617;
    }

    .card h2 {
      font-family: "Syne", sans-serif;
      font-size: 1.2rem;
      margin: 0 0 12px;
    }

    .progress {
      width: 100%;
      height: 12px;
      background: #020617;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress span {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #22d3ee);
      transition: width 0.4s ease;
    }

    .stat {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    button {
      width: 100%;
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(135deg, #38bdf8, #22d3ee);
      color: #020617;
      margin-top: 10px;
    }

    .goal-buttons button {
      margin-top: 8px;
      background: #020617;
      color: var(--text);
      border: 1px solid #1e293b;
    }

    .goal-buttons button.active {
      background: linear-gradient(135deg, #38bdf8, #22d3ee);
      color: #020617;
    }

    input[type="range"] {
      width: 100%;
      margin-top: 10px;
    }

    .ai {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #e2e8f0;
    }

    footer {
      text-align: center;
      padding: 28px 10px;
      font-size: 0.75rem;
      color: var(--muted);
    }
    /* Theme toggle header layout */
.header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

#themeToggle {
  background: #020617;
  border: 1px solid var(--muted);
  color: var(--text);
  font-size: 1rem;
  padding: 6px 10px;
  border-radius: 10px;
  cursor: pointer;
}
  </style>
</head>

<body>
<header>
  <div class="header-row">
    <h1>HydroCamel</h1>

    <button id="themeToggle" aria-label="Toggle theme">
      🌙
    </button>
  </div>

  <p>Smart hydration intelligence</p>
</header>
<main>

  <div class="card">
    <h2>Daily Goal</h2>

    <div class="goal-buttons">
      <button data-goal="2000">2000 ml · Light</button>
      <button data-goal="2500">2500 ml · Normal</button>
      <button data-goal="3000">3000 ml · Active</button>
    </div>

    <input type="range" min="1500" max="4000" step="250" id="customGoal">
    <div class="stat">
      <span>Custom goal</span>
      <span id="goalValue">2500 ml</span>
    </div>
  </div>

  <div class="card">
    <h2>Today’s Hydration</h2>

    <div class="progress">
      <span id="progressBar"></span>
    </div>

    <div class="stat">
      <span id="amountText">0 ml</span>
      <span id="goalText">Goal: 2500 ml</span>
    </div>

    <button id="drinkBtn">+ Drink 250 ml</button>
  </div>

  <div class="card">
    <h2>AI Hydration Insight</h2>
    <div class="ai" id="aiText"></div>
  </div>

  <div class="card">
    <h2>Weekly Intelligence Report</h2>
    <div class="ai" id="weeklyText"></div>
  </div>

</main>

<footer>
  Built with 💧 discipline · Works offline
</footer>

<script>
// Theme handling
const root = document.documentElement;
const themeToggle = document.getElementById("themeToggle");

const savedTheme = localStorage.getItem("theme");
const systemPrefersLight =
  window.matchMedia &&
  window.matchMedia("(prefers-color-scheme: light)").matches;

// Apply initial theme
if (savedTheme === "light" || (!savedTheme && systemPrefersLight)) {
  root.classList.add("light");
  themeToggle.textContent = "☀️ Light";
} else {
  themeToggle.textContent = "🌙 Dark";
}

// Toggle theme on click
themeToggle.onclick = () => {
  const isLight = root.classList.toggle("light");
  localStorage.setItem("theme", isLight ? "light" : "dark");
  themeToggle.textContent = isLight ? "☀️ Light" : "🌙 Dark";
};
  const STEP = 250;
  const todayKey = new Date().toISOString().slice(0, 10);

  const data = JSON.parse(localStorage.getItem("hydration") || "{}");
  data[todayKey] = data[todayKey] || 0;

  let GOAL = Number(localStorage.getItem("goal")) || 2500;

  const progressBar = document.getElementById("progressBar");
  const amountText = document.getElementById("amountText");
  const goalText = document.getElementById("goalText");
  const aiText = document.getElementById("aiText");
  const weeklyText = document.getElementById("weeklyText");
  const drinkBtn = document.getElementById("drinkBtn");
  const goalButtons = document.querySelectorAll(".goal-buttons button");
  const customGoal = document.getElementById("customGoal");
  const goalValue = document.getElementById("goalValue");

  function setGoal(value) {
    GOAL = value;
    localStorage.setItem("goal", value);
    goalText.textContent = "Goal: " + value + " ml";
    goalValue.textContent = value + " ml";
    customGoal.value = value;

    goalButtons.forEach(btn =>
      btn.classList.toggle("active", Number(btn.dataset.goal) === value)
    );

    updateUI(data[todayKey]);
  }

  function updateUI(amount) {
    const percent = Math.min((amount / GOAL) * 100, 100);
    progressBar.style.width = percent + "%";
    amountText.textContent = amount + " ml";

    if (amount < GOAL * 0.4) {
      aiText.textContent = "You’re under your hydration curve. Sip steadily.";
    } else if (amount < GOAL * 0.8) {
      aiText.textContent = "Good pace. Keep spreading intake across the day.";
    } else if (amount < GOAL) {
      aiText.textContent = "Almost there. One or two more glasses.";
    } else {
      aiText.textContent = "Goal achieved. Excellent hydration discipline.";
    }
  }

  function updateWeekly() {
    const days = Object.values(data);
    if (days.length < 3) {
      weeklyText.textContent = "Log a few more days to unlock insights.";
      return;
    }

    const avg = Math.round(days.reduce((a,b)=>a+b,0)/days.length);
    weeklyText.textContent =
      `Average intake: ${avg} ml/day. ` +
      (avg >= GOAL ? "Strong consistency." : "Try nudging intake higher.");
  }

  drinkBtn.onclick = () => {
    data[todayKey] += STEP;
    localStorage.setItem("hydration", JSON.stringify(data));
    updateUI(data[todayKey]);
    updateWeekly();
  };

  goalButtons.forEach(btn =>
    btn.onclick = () => setGoal(Number(btn.dataset.goal))
  );

  customGoal.oninput = e => setGoal(Number(e.target.value));

  setGoal(GOAL);
  updateWeekly();

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/hydrocamel/sw.js");
  }
</script>

</body>
</html>
