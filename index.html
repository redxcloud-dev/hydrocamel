<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>HydroCamel</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      background: #f5fbff;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 420px;
      padding: 16px;
      text-align: center;
    }

    /* Camel */
    .camel {
      width: 180px;
      margin: 20px auto 10px;
      transition: transform 0.2s ease;
    }

    /* Stats */
    .stats {
      margin-top: 8px;
      font-size: 18px;
      font-weight: 600;
    }

    /* Glass */
    .glass-container {
      margin: 24px auto;
      width: 140px;
      height: 220px;
      border: 4px solid #4aa3ff;
      border-radius: 0 0 20px 20px;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      background: #ffffff;
    }

    .water {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 30%;
      background: linear-gradient(#6ecbff, #2b8cff);
      transition: height 0.4s ease;
    }

    .plus {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 42px;
      font-weight: bold;
      color: #2b8cff;
      pointer-events: none;
    }

    /* Intake sheet */
    .sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: -100%;
      background: #fff;
      border-radius: 20px 20px 0 0;
      padding: 20px;
      box-shadow: 0 -6px 20px rgba(0,0,0,0.15);
      transition: bottom 0.3s ease;
    }

    .sheet.show {
      bottom: 0;
    }

    .sheet h3 {
      margin-top: 0;
    }

    .options {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }

    .option {
      flex: 1;
      padding: 14px;
      background: #e9f4ff;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
    }

    .option:hover {
      background: #d8ecff;
    }
  </style>
</head>

<body>
  <div class="app">

    <!-- CAMEL -->
    <img
      id="camel"
      class="camel"
      src="./camel-normal.png"
      alt="Camel"
    />

    <!-- STATS -->
    <div class="stats">
      <span id="current">0</span> ml / <span id="goal">2000</span> ml
    </div>

    <!-- GLASS -->
    <div class="glass-container" id="glass">
      <div class="water" id="water"></div>
      <div class="plus">+</div>
    </div>

  </div>

  <!-- INTAKE SHEET -->
  <div class="sheet" id="sheet">
    <h3>Add Water</h3>
    <div class="options">
      <div class="option" data-ml="250">250 ml</div>
      <div class="option" data-ml="350">350 ml</div>
      <div class="option" data-ml="500">500 ml</div>
    </div>
  </div>

  <script>
    /* ------------------ STATE ------------------ */
    const dailyGoal = 2000;
    let currentWater = Number(localStorage.getItem("water") || 0);

    /* ------------------ ELEMENTS ------------------ */
    const currentEl = document.getElementById("current");
    const goalEl = document.getElementById("goal");
    const waterEl = document.getElementById("water");
    const glass = document.getElementById("glass");
    const sheet = document.getElementById("sheet");
    const camelImg = document.getElementById("camel");

    goalEl.textContent = dailyGoal;

    /* ------------------ CAMEL REACTIONS ------------------ */
    const CAMEL_REACTIONS = [
      { state: "blink", duration: 600 },
      { state: "wink", duration: 700 },
      { state: "kiss", duration: 1000 }
    ];

    let camelLocked = false;
    let camelTimer = null;

    function playCamelReaction() {
      if (camelLocked) return;

      const reaction =
        CAMEL_REACTIONS[Math.floor(Math.random() * CAMEL_REACTIONS.length)];

      camelLocked = true;
      camelImg.src = `./camel-${reaction.state}.png`;

      clearTimeout(camelTimer);
      camelTimer = setTimeout(() => {
        camelImg.src = "./camel-normal.png";
        camelLocked = false;
      }, reaction.duration);
    }

    /* ------------------ UI UPDATE ------------------ */
    function updateUI() {
      currentEl.textContent = currentWater;
      const percent = Math.min(currentWater / dailyGoal, 1);
      waterEl.style.height = `${percent * 100}%`;
    }

    updateUI();

    /* ------------------ GLASS ------------------ */
    glass.addEventListener("click", () => {
      sheet.classList.add("show");
    });

    document.querySelectorAll(".option").forEach(opt => {
      opt.addEventListener("click", () => {
        const ml = Number(opt.dataset.ml);
        currentWater += ml;
        localStorage.setItem("water", currentWater);

        updateUI();
        playCamelReaction();

        sheet.classList.remove("show");
      });
    });

    /* ------------------ CLOSE SHEET ON OUTSIDE TAP ------------------ */
    document.addEventListener("click", e => {
      if (!sheet.contains(e.target) && !glass.contains(e.target)) {
        sheet.classList.remove("show");
      }
    });
  </script>
</body>
</html>
