<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>HydroCamel</title>

  <!-- ICONS (this brings icon-512.png BACK) -->
  <link rel="icon" href="icon-512.png" sizes="512x512">
  <link rel="apple-touch-icon" href="icon-512.png">

  <style>
    :root {
      --bg: #f7f9fb;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #2bb0ed;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text);
    }

    .app {
      width: 100%;
      max-width: 420px;
      padding: 32px 24px 40px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
    }

    .subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 14px;
    }

    .amount {
      margin-top: 28px;
      font-size: 42px;
      font-weight: 800;
    }

    .goal {
      margin-top: 6px;
      color: var(--muted);
      font-size: 15px;
    }

    .camel-wrap {
      margin: 30px 0 16px;
    }

    .camel {
      width: 260px;
      height: auto;
      transition: transform 0.2s ease;
    }

    .message {
      margin-top: 6px;
      color: var(--muted);
      font-size: 14px;
    }

    .slider-wrap {
      margin-top: 28px;
    }

    input[type="range"] {
      width: 100%;
    }

    .slider-value {
      margin-top: 8px;
      font-weight: 600;
    }

    button {
      margin-top: 18px;
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    footer {
      margin-top: 28px;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>

<body>
  <div class="app">
    <h1>HydroCamel</h1>
    <div class="subtitle">Smart hydration intelligence</div>

    <div class="amount" id="total">0 ml</div>
    <div class="goal">of 2500 ml</div>

    <div class="camel-wrap">
      <img
        id="camel"
        class="camel"
        src="camel-normal.png"
        alt="Camel"
      />
    </div>

    <div class="message" id="message">Start hydrating 💧</div>

    <div class="slider-wrap">
      <input
        type="range"
        min="100"
        max="500"
        step="50"
        value="300"
        id="slider"
      />
      <div class="slider-value">
        <span id="sliderValue">300</span> ml
      </div>
    </div>

    <button onclick="addWater()">Add water</button>

    <footer>Calm · Private · Offline-friendly</footer>
  </div>

  <script>
    let total = 0;
    const goal = 2500;

    const camel = document.getElementById("camel");
    const totalEl = document.getElementById("total");
    const slider = document.getElementById("slider");
    const sliderValue = document.getElementById("sliderValue");
    const message = document.getElementById("message");

    slider.addEventListener("input", () => {
      sliderValue.textContent = slider.value;
    });

    function setCamel(src, duration = 700) {
      camel.src = src;
      setTimeout(() => {
        camel.src = "camel-normal.png";
      }, duration);
    }

    function addWater() {
      const amount = parseInt(slider.value, 10);
      total = Math.min(goal, total + amount);
      totalEl.textContent = `${total} ml`;

      // Reactions
      if (amount >= 500) {
        setCamel("camel-kiss.png", 900);
        message.textContent = "Camel loves you 😘";
      } else if (total % 2 === 0) {
        setCamel("camel-blink.png", 500);
        message.textContent = "Nice sip!";
      } else {
        setCamel("camel-wink.png", 600);
        message.textContent = "Keep going 😉";
      }

      if (total >= goal) {
        message.textContent = "Goal achieved 🎉 Amazing!";
      }
    }
  </script>
</body>
</html>
