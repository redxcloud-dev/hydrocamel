<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>HydroCamel</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f7f9fb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HydroCamel">
  <link rel="apple-touch-icon" href="icon-512.png">

  <style>
    body {
      margin: 0;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f7f9fb;
      color: #1f2937;
      text-align: center;
    }

    h1 {
      margin-top: 32px;
      font-size: 36px;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 24px;
    }

    .amount {
      font-size: 48px;
      font-weight: 700;
    }

    .target {
      color: #6b7280;
      margin-bottom: 16px;
    }

    #camelImage {
      width: 220px;
      margin: 16px auto;
      display: block;
    }

    .hint {
      color: #6b7280;
      margin-bottom: 12px;
    }

    .glass {
      width: 120px;
      height: 180px;
      border: 4px solid #38bdf8;
      border-radius: 16px;
      margin: 0 auto 20px;
      position: relative;
      overflow: hidden;
      background: #fff;
    }

    .water {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 0%;
      background: #38bdf8;
      transition: height 0.4s ease;
    }

    .add-btn {
      width: 90%;
      max-width: 320px;
      margin: 0 auto;
      padding: 16px;
      font-size: 18px;
      background: #38bdf8;
      color: white;
      border: none;
      border-radius: 16px;
    }

    .footer {
      margin: 24px 0;
      font-size: 14px;
      color: #6b7280;
    }
  </style>
</head>

<body>

  <h1>HydroCamel</h1>
  <div class="subtitle">Smart hydration intelligence</div>

  <div class="amount">
    <span id="current">0</span> ml
  </div>
  <div class="target">of 2500 ml</div>

  <!-- ✅ CAMEL (FIXED PATH) -->
  <img
    id="camelImage"
    src="./camel-normal.png"
    alt="HydroCamel"
  >

  <div class="hint">Start hydrating 💧</div>

  <!-- Glass -->
  <div class="glass">
    <div id="water" class="water"></div>
  </div>

  <button class="add-btn" onclick="addWater(250)">
    Add 250 ml
  </button>

  <div class="footer">
    Calm · Private · Offline-friendly
  </div>

  <script>
    const GOAL = 2500;
    let intake = 0;

    function updateUI() {
      document.getElementById("current").textContent = intake;
      const percent = Math.min((intake / GOAL) * 100, 100);
      document.getElementById("water").style.height = percent + "%";

      const camel = document.getElementById("camelImage");
      if (intake === 0) camel.src = "camel-normal.png";
      else if (intake < 1000) camel.src = "camel-blink.png";
      else if (intake < 2000) camel.src = "camel-wink.png";
      else camel.src = "camel-kiss.png";
    }

    function addWater(amount) {
      intake = Math.min(intake + amount, GOAL);
      updateUI();
    }

    updateUI();

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>

</body>
</html>
