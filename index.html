<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HydroCamel</title>

  <link rel="icon" href="icon-512.png" sizes="512x512">
  <link rel="apple-touch-icon" href="icon-512.png">

  <style>
    :root {
      --bg: #f7f9fb;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #2bb0ed;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text);
      overflow: hidden;
    }

    .app {
      width: 100%;
      max-width: 420px;
      padding: 32px 24px 40px;
      text-align: center;
    }

    h1 { font-size: 28px; margin: 0; }
    .subtitle { color: var(--muted); font-size: 14px; }

    .amount {
      margin-top: 28px;
      font-size: 42px;
      font-weight: 800;
    }

    .goal { color: var(--muted); }

    .camel-wrap {
      position: relative;
      margin: 30px 0 16px;
    }

    .camel {
      width: 260px;
    }

    .message {
      color: var(--muted);
      font-size: 14px;
    }

    input[type="range"] { width: 100%; }

    button {
      margin-top: 18px;
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    footer {
      margin-top: 28px;
      font-size: 12px;
      color: var(--muted);
    }

    .float {
      position: absolute;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
      font-weight: 700;
      animation: floatUp 1s ease forwards;
    }

    .heart {
      position: absolute;
      right: 20%;
      top: 20%;
      animation: heartPop 1s ease forwards;
    }

    .confetti {
      position: fixed;
      top: -10px;
      width: 8px;
      height: 14px;
      animation: confettiFall linear forwards;
    }

    @keyframes floatUp {
      to { opacity: 0; transform: translate(-50%, -40px); }
    }

    @keyframes heartPop {
      to { opacity: 0; transform: translateY(-30px) scale(0.8); }
    }

    @keyframes confettiFall {
      to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }
  </style>
</head>

<body>
<div class="app">
  <h1>HydroCamel</h1>
  <div class="subtitle">Smart hydration intelligence</div>

  <div class="amount" id="total">0 ml</div>
  <div class="goal">of 2500 ml</div>

  <div class="camel-wrap" id="camelWrap">
    <img id="camel" class="camel" src="camel-normal.png">
  </div>

  <div class="message" id="message">Start hydrating 💧</div>

  <input type="range" min="100" max="500" step="50" id="slider">
  <div><span id="sliderValue"></span> ml</div>

  <button onclick="addWater()">Add water</button>
  <footer>Calm · Private · Offline-friendly</footer>
</div>

<script>
const GOAL = 2500;

const camel = document.getElementById("camel");
const camelWrap = document.getElementById("camelWrap");
const totalEl = document.getElementById("total");
const slider = document.getElementById("slider");
const sliderValue = document.getElementById("sliderValue");
const message = document.getElementById("message");

let total = Number(localStorage.getItem("hydrocamel-total")) || 0;
let lastMilestone = Number(localStorage.getItem("hydrocamel-milestone")) || 0;
let goalReached = localStorage.getItem("hydrocamel-goal") === "true";
let confettiShown = localStorage.getItem("hydrocamel-confetti") === "true";

totalEl.textContent = `${total} ml`;
slider.value = localStorage.getItem("hydrocamel-slider") || 300;
sliderValue.textContent = slider.value;

slider.oninput = () => {
  sliderValue.textContent = slider.value;
  localStorage.setItem("hydrocamel-slider", slider.value);
};

function react(src, duration = 600) {
  camel.src = src;
  setTimeout(() => camel.src = "camel-normal.png", duration);
}

function floatAmount(amount) {
  const el = document.createElement("div");
  el.className = "float";
  el.textContent = `+${amount} ml`;
  camelWrap.appendChild(el);
  setTimeout(() => el.remove(), 1000);
}

function popHeart() {
  const h = document.createElement("div");
  h.className = "heart";
  h.textContent = "❤️";
  camelWrap.appendChild(h);
  setTimeout(() => h.remove(), 1000);
}

function launchConfetti() {
  if (confettiShown) return;
  confettiShown = true;
  localStorage.setItem("hydrocamel-confetti", "true");

  for (let i = 0; i < 80; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = ["#2bb0ed","#ff4d6d","#22c55e","#facc15"][i % 4];
    c.style.animationDuration = 2 + Math.random() * 2 + "s";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4000);
  }
}

function addWater() {
  const amount = Number(slider.value);
  total = Math.min(GOAL, total + amount);
  totalEl.textContent = `${total} ml`;
  localStorage.setItem("hydrocamel-total", total);

  floatAmount(amount);

  const milestone = Math.floor(total / 500);

  if (milestone > lastMilestone && total < GOAL) {
    react("camel-kiss.png", 900);
    popHeart();
    message.textContent = "Camel loves your consistency 😘";
    lastMilestone = milestone;
    localStorage.setItem("hydrocamel-milestone", milestone);
  } else {
    react("camel-blink.png", 500);
    message.textContent = "Nice sip!";
  }

  if (total >= GOAL && !goalReached) {
    goalReached = true;
    camel.src = "camel-wink.png";
    message.textContent = "Goal achieved 🎉";
    localStorage.setItem("hydrocamel-goal", "true");
    launchConfetti();
  }
}
</script>
</body>
</html>
