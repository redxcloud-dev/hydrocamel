<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HydroCamel</title>

  <link rel="icon" href="icon-512.png" sizes="512x512">
  <link rel="apple-touch-icon" href="icon-512.png">

  <style>
    :root {
      --bg: #f7f9fb;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #2bb0ed;
      --heart: #ff4d6d;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text);
      overflow: hidden;
    }

    .app {
      width: 100%;
      max-width: 420px;
      padding: 32px 24px 40px;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
    }

    .subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 14px;
    }

    .amount {
      margin-top: 28px;
      font-size: 42px;
      font-weight: 800;
    }

    .goal {
      margin-top: 6px;
      color: var(--muted);
      font-size: 15px;
    }

    .camel-wrap {
      position: relative;
      margin: 30px 0 16px;
    }

    .camel {
      width: 260px;
    }

    .message {
      color: var(--muted);
      font-size: 14px;
    }

    /* GLASS BUTTON */
    .glass-btn {
      margin: 28px auto 0;
      width: 120px;
      height: 180px;
      border: 3px solid var(--accent);
      border-radius: 0 0 16px 16px;
      position: relative;
      cursor: pointer;
    }

    .glass-water {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 40%;
      background: var(--accent);
      border-radius: 0 0 12px 12px;
    }

    .glass-plus {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 32px;
      color: white;
      font-weight: 700;
      pointer-events: none;
    }

    footer {
      margin-top: 28px;
      font-size: 12px;
      color: var(--muted);
    }

    /* FULLSCREEN INTAKE */
    .intake-screen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 10;
      display: none;
      padding: 24px;
      text-align: center;
    }

    .intake-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .close {
      font-size: 28px;
      cursor: pointer;
    }

    .preset-wrap {
      margin-top: 40px;
      display: flex;
      justify-content: space-around;
    }

    .preset {
      width: 80px;
      height: 140px;
      border: 2px solid var(--accent);
      border-radius: 0 0 14px 14px;
      position: relative;
      cursor: pointer;
    }

    .preset-water {
      position: absolute;
      bottom: 0;
      width: 100%;
      background: var(--accent);
      border-radius: 0 0 12px 12px;
    }

    .preset-label {
      margin-top: 8px;
      font-weight: 600;
    }

    .confirm {
      margin-top: 40px;
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    /* FLOAT */
    .float {
      position: absolute;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
      animation: floatUp 1s ease forwards;
      pointer-events: none;
    }

    @keyframes floatUp {
      from { opacity: 0; transform: translate(-50%, 10px); }
      20% { opacity: 1; }
      to { opacity: 0; transform: translate(-50%, -40px); }
    }
  </style>
</head>

<body>
  <div class="app">
    <h1>HydroCamel</h1>
    <div class="subtitle">Smart hydration intelligence</div>

    <div class="amount" id="total">0 ml</div>
    <div class="goal">of 2500 ml</div>

    <div class="camel-wrap" id="camelWrap">
      <img id="camel" class="camel" src="camel-normal.png" />
    </div>

    <div class="message" id="message">Start hydrating 💧</div>

    <!-- GLASS BUTTON -->
    <div class="glass-btn" onclick="openIntake()">
      <div class="glass-water"></div>
      <div class="glass-plus">+</div>
    </div>

    <footer>Calm · Private · Offline-friendly</footer>
  </div>

  <!-- FULLSCREEN INTAKE -->
  <div class="intake-screen" id="intake">
    <div class="intake-header">
      <div></div>
      <div class="close" onclick="closeIntake()">✕</div>
    </div>

    <h2>Add water</h2>

    <div class="preset-wrap">
      <div class="preset" onclick="selectAmount(250)">
        <div class="preset-water" style="height:40%"></div>
        <div class="preset-label">250 ml</div>
      </div>

      <div class="preset" onclick="selectAmount(350)">
        <div class="preset-water" style="height:60%"></div>
        <div class="preset-label">350 ml</div>
      </div>

      <div class="preset" onclick="selectAmount(500)">
        <div class="preset-water" style="height:90%"></div>
        <div class="preset-label">500 ml</div>
      </div>
    </div>

    <button class="confirm" onclick="confirmAdd()">Add water</button>
  </div>

  <script>
    const GOAL = 2500;

    const camel = document.getElementById("camel");
    const camelWrap = document.getElementById("camelWrap");
    const totalEl = document.getElementById("total");
    const message = document.getElementById("message");
    const intake = document.getElementById("intake");

    let total = Number(localStorage.getItem("hydrocamel-total")) || 0;
    let selectedAmount = 250;
    let lastMilestone = Math.floor(total / 500);

    totalEl.textContent = `${total} ml`;

    function openIntake() {
      intake.style.display = "block";
    }

    function closeIntake() {
      intake.style.display = "none";
    }

    function selectAmount(val) {
      selectedAmount = val;
    }

    function react(src, duration = 700) {
      camel.src = src;
      setTimeout(() => camel.src = "camel-normal.png", duration);
    }

    function floatAmount(amount) {
      const el = document.createElement("div");
      el.className = "float";
      el.textContent = `+${amount} ml`;
      camelWrap.appendChild(el);
      setTimeout(() => el.remove(), 1000);
    }

    function confirmAdd() {
      closeIntake();

      const prevTotal = total;
      total = Math.min(GOAL, total + selectedAmount);
      totalEl.textContent = `${total} ml`;
      localStorage.setItem("hydrocamel-total", total);

      floatAmount(selectedAmount);

      const newMilestone = Math.floor(total / 500);
      if (newMilestone > lastMilestone) {
        react("camel-kiss.png", 900);
        message.textContent = "Great hydration 😘";
        lastMilestone = newMilestone;
      } else {
        react("camel-blink.png", 500);
        message.textContent = "Nice sip!";
      }

      if (total >= GOAL) {
        camel.src = "camel-wink.png";
        message.textContent = "Goal achieved 🎉";
      }
    }
  </script>
</body>
</html>
