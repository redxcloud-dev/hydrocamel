<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HydroCamel</title>

<link rel="icon" href="icon-512.png" sizes="512x512">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="manifest" href="manifest.json">

<style>
:root {
  --bg:#f7f9fb;
  --text:#1f2937;
  --muted:#6b7280;
  --accent:#2bb0ed;
}

* { box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif }

body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow:hidden;
}

.screen {
  position:absolute;
  inset:0;
  padding:32px 24px;
  transition:transform .35s ease;
  background:var(--bg);
}

.hidden { transform:translateX(100%) }

h1 { margin:0; font-size:28px }
.subtitle { color:var(--muted); font-size:14px }

.amount { font-size:42px; font-weight:800; margin-top:24px }
.goal { color:var(--muted); font-size:15px }

.camel-wrap { margin:30px 0 16px; position:relative }
.camel { width:260px }

.message { color:var(--muted); font-size:14px }

.slider-wrap { margin-top:28px }
button {
  margin-top:18px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:var(--accent);
  color:white;
  font-size:16px;
  font-weight:600;
}

.settings-btn {
  position:absolute;
  top:24px;
  right:24px;
  font-size:22px;
  background:none;
  border:none;
}

/* Settings */
.header {
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:24px;
}
.back {
  font-size:20px;
  background:none;
  border:none;
}

.setting {
  padding:16px;
  border-radius:14px;
  background:white;
  margin-bottom:14px;
}

/* Animations */
.float {
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  font-weight:700;
  animation:float 1s forwards;
}
@keyframes float {
  from{opacity:0; transform:translate(-50%,10px)}
  to{opacity:0; transform:translate(-50%,-40px)}
}

.heart {
  position:absolute;
  right:20%;
  top:20%;
  animation:heart 1s forwards;
}
@keyframes heart {
  from{opacity:0; transform:scale(.5)}
  to{opacity:0; transform:scale(1.2) translateY(-30px)}
}

.confetti {
  position:fixed;
  top:-10px;
  width:8px;
  height:14px;
  animation:fall 3s linear forwards;
}
@keyframes fall {
  to{transform:translateY(110vh) rotate(720deg); opacity:0}
}
</style>
</head>

<body>

<!-- MAIN -->
<div class="screen" id="main">
<button class="settings-btn" onclick="openSettings()">⚙️</button>

<h1>HydroCamel</h1>
<div class="subtitle">Smart hydration intelligence</div>

<div class="amount" id="total">0 ml</div>
<div class="goal">of <span id="goalText"></span> ml</div>

<div class="camel-wrap" id="camelWrap">
  <img id="camel" class="camel" src="camel-normal.png">
</div>

<div class="message" id="message">Start hydrating 💧</div>

<div class="slider-wrap">
<input type="range" min="100" max="500" step="50" id="slider">
<div><span id="sliderValue"></span> ml</div>
</div>

<button onclick="addWater()">Add water</button>
</div>

<!-- SETTINGS -->
<div class="screen hidden" id="settings">
<div class="header">
<button class="back" onclick="closeSettings()">←</button>
<h2>Settings</h2>
</div>

<div class="setting">
<label>Daily goal (ml)</label><br>
<input type="number" id="goalInput">
</div>

<div class="setting">
<label>Daily reset time</label><br>
<input type="time" id="resetInput">
</div>

<button onclick="saveSettings()">Save</button>
</div>

<script>
let goal = Number(localStorage.getItem("goal")) || 2500;
let total = Number(localStorage.getItem("total")) || 0;
let sliderVal = Number(localStorage.getItem("slider")) || 300;
let resetTime = localStorage.getItem("resetTime") || "00:00";
let lastReset = localStorage.getItem("lastReset");

const camel = document.getElementById("camel");
const totalEl = document.getElementById("total");
const goalText = document.getElementById("goalText");
const slider = document.getElementById("slider");
const sliderValue = document.getElementById("sliderValue");
const message = document.getElementById("message");
const camelWrap = document.getElementById("camelWrap");

goalText.textContent = goal;
totalEl.textContent = total + " ml";
slider.value = sliderVal;
sliderValue.textContent = sliderVal;

function checkReset(){
  const now = new Date();
  const [h,m] = resetTime.split(":");
  const reset = new Date();
  reset.setHours(h,m,0,0);
  if(now >= reset && lastReset !== reset.toDateString()){
    total = 0;
    localStorage.setItem("total",0);
    localStorage.setItem("lastReset", reset.toDateString());
    totalEl.textContent="0 ml";
  }
}
checkReset();

slider.oninput=()=>{
  sliderValue.textContent=slider.value;
  localStorage.setItem("slider",slider.value);
};

function react(img,d=700){
  camel.src=img;
  setTimeout(()=>camel.src="camel-normal.png",d);
}

function addWater(){
  const amt=Number(slider.value);
  const prev=Math.floor(total/500);
  total=Math.min(goal,total+amt);
  totalEl.textContent=total+" ml";
  localStorage.setItem("total",total);

  const f=document.createElement("div");
  f.className="float";
  f.textContent="+"+amt+" ml";
  camelWrap.appendChild(f);
  setTimeout(()=>f.remove(),1000);

  if(Math.floor(total/500)>prev){
    react("camel-kiss.png",900);
    const h=document.createElement("div");
    h.className="heart";
    h.textContent="❤️";
    camelWrap.appendChild(h);
    setTimeout(()=>h.remove(),1000);
  } else {
    react("camel-blink.png");
  }

  if(total>=goal){
    camel.src="camel-wink.png";
    for(let i=0;i<60;i++){
      const c=document.createElement("div");
      c.className="confetti";
      c.style.left=Math.random()*100+"vw";
      c.style.background=["#2bb0ed","#ff4d6d","#22c55e","#facc15"][Math.floor(Math.random()*4)];
      document.body.appendChild(c);
      setTimeout(()=>c.remove(),3000);
    }
  }
}

function openSettings(){
  document.getElementById("settings").classList.remove("hidden");
}
function closeSettings(){
  document.getElementById("settings").classList.add("hidden");
}

function saveSettings(){
  goal=Number(document.getElementById("goalInput").value)||goal;
  resetTime=document.getElementById("resetInput").value||resetTime;
  localStorage.setItem("goal",goal);
  localStorage.setItem("resetTime",resetTime);
  goalText.textContent=goal;
  closeSettings();
}

document.getElementById("goalInput").value=goal;
document.getElementById("resetInput").value=resetTime;
</script>

</body>
</html>
