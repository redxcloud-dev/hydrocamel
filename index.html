<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HydroCamel</title>

<link rel="icon" href="icon-512.png" sizes="512x512">
<link rel="apple-touch-icon" href="icon-512.png">

<style>
:root {
  --bg:#f7f9fb;
  --text:#1f2937;
  --muted:#6b7280;
  --accent:#2bb0ed;
}

*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}

body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  display:flex;
  justify-content:center;
  align-items:center;
}

.app{
  width:100%;
  max-width:420px;
  padding:32px 24px 40px;
  text-align:center;
  position:relative;
}

h1{margin:0;font-size:28px}
.subtitle{color:var(--muted);font-size:14px}

.settings-btn{
  position:absolute;
  top:20px;
  right:20px;
  font-size:20px;
  cursor:pointer;
}

.amount{margin-top:28px;font-size:42px;font-weight:800}
.goal{color:var(--muted)}

.camel-wrap{margin:28px 0;position:relative}
.camel{width:260px}

.message{font-size:14px;color:var(--muted)}

.slider-wrap{margin-top:24px}
input[type=range]{width:100%}

button{
  margin-top:18px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:var(--accent);
  color:white;
  font-size:16px;
  font-weight:600;
}

.settings{
  margin-top:24px;
  padding:16px;
  border-radius:14px;
  background:white;
  display:none;
  text-align:left;
}

.settings label{font-size:14px;color:var(--muted)}
.settings input{width:100%;margin-top:6px}

.float{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  font-weight:700;
  animation:floatUp 1s ease forwards;
}

@keyframes floatUp{
  from{opacity:0;transform:translate(-50%,10px)}
  to{opacity:0;transform:translate(-50%,-40px)}
}

.heart{
  position:absolute;
  right:20%;
  top:20%;
  font-size:26px;
  animation:floatUp 1s ease forwards;
}

.confetti{
  position:fixed;
  top:-10px;
  width:8px;
  height:14px;
  animation:fall linear forwards;
}

@keyframes fall{
  to{transform:translateY(110vh) rotate(720deg);opacity:0}
}
</style>
</head>

<body>
<div class="app">
  <div class="settings-btn" onclick="toggleSettings()">⚙️</div>

  <h1>HydroCamel</h1>
  <div class="subtitle">Smart hydration intelligence</div>

  <div class="amount" id="total">0 ml</div>
  <div class="goal">of 2500 ml</div>

  <div class="camel-wrap" id="camelWrap">
    <img id="camel" class="camel" src="camel-normal.png">
  </div>

  <div class="message" id="message">Start hydrating 💧</div>

  <div class="slider-wrap">
    <input type="range" min="100" max="500" step="50" id="slider">
    <div><span id="sliderValue"></span> ml</div>
  </div>

  <button onclick="addWater()">Add water</button>

  <div class="settings" id="settings">
    <label>Daily reset time</label>
    <input type="time" id="resetTime">
  </div>
</div>

<script>
const GOAL = 2500;
const camel = document.getElementById("camel");
const wrap = document.getElementById("camelWrap");
const totalEl = document.getElementById("total");
const slider = document.getElementById("slider");
const sliderValue = document.getElementById("sliderValue");
const message = document.getElementById("message");
const resetInput = document.getElementById("resetTime");

let total = +localStorage.getItem("total") || 0;
let sliderVal = +localStorage.getItem("slider") || 300;
let lastMilestone = +localStorage.getItem("milestone") || 0;
let resetTime = localStorage.getItem("resetTime") || "03:00";
let confettiDone = localStorage.getItem("confetti") === "1";

slider.value = sliderVal;
sliderValue.textContent = sliderVal;
totalEl.textContent = `${total} ml`;
resetInput.value = resetTime;

slider.oninput = () => {
  sliderValue.textContent = slider.value;
  localStorage.setItem("slider", slider.value);
};

resetInput.onchange = () => {
  localStorage.setItem("resetTime", resetInput.value);
};

function toggleSettings(){
  const s = document.getElementById("settings");
  s.style.display = s.style.display === "block" ? "none" : "block";
}

function react(src, ms=600){
  camel.src = src;
  setTimeout(()=>camel.src="camel-normal.png",ms);
}

function floatText(text){
  const f=document.createElement("div");
  f.className="float";
  f.textContent=text;
  wrap.appendChild(f);
  setTimeout(()=>f.remove(),1000);
}

function heart(){
  const h=document.createElement("div");
  h.className="heart";
  h.textContent="❤️";
  wrap.appendChild(h);
  setTimeout(()=>h.remove(),1000);
}

function confetti(){
  if(confettiDone) return;
  confettiDone=true;
  localStorage.setItem("confetti","1");
  for(let i=0;i<80;i++){
    const c=document.createElement("div");
    c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    c.style.background=["#2bb0ed","#22c55e","#facc15","#ff4d6d"][i%4];
    c.style.animationDuration=2+Math.random()*2+"s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),4000);
  }
}

function addWater(){
  const amt=+slider.value;
  total=Math.min(GOAL,total+amt);
  totalEl.textContent=`${total} ml`;
  localStorage.setItem("total",total);
  floatText(`+${amt} ml`);

  const milestone=Math.floor(total/500)*500;
  if(milestone>lastMilestone){
    lastMilestone=milestone;
    localStorage.setItem("milestone",milestone);
    react("camel-kiss.png",900);
    heart();
    message.textContent="Camel loves you 😘";
  }else{
    react("camel-blink.png",400);
    message.textContent="Nice sip!";
  }

  if(total>=GOAL){
    camel.src="camel-wink.png";
    message.textContent="Goal achieved 🎉";
    confetti();
  }
}

function dailyResetCheck(){
  const now=new Date();
  const [h,m]=resetTime.split(":");
  if(now.getHours()==h && now.getMinutes()==m){
    localStorage.clear();
    location.reload();
  }
}
setInterval(dailyResetCheck,60000);
</script>
</body>
</html>
