<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>HydroCamel</title>

<style>
:root {
  --blue: #2fa8e1;
  --bg: #f7f9fb;
  --text: #1f2933;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
  background: var(--bg);
  color: var(--text);
  text-align: center;
}

.container {
  padding: 40px 20px 30px;
}

h1 {
  margin: 0;
  font-size: 34px;
  font-weight: 700;
}

.subtitle {
  margin-top: 4px;
  color: #6b7280;
}

.amount {
  margin-top: 30px;
  font-size: 48px;
  font-weight: 800;
}

.goal {
  color: #6b7280;
}

.camel {
  width: 260px;
  margin: 30px auto 10px;
}

.hint {
  color: #6b7280;
  margin-bottom: 20px;
}

/* Main Glass */
.main-glass {
  width: 120px;
  height: 180px;
  border: 4px solid var(--blue);
  border-radius: 16px;
  margin: 0 auto 24px;
  position: relative;
  overflow: hidden;
  cursor: pointer;
}

.main-fill {
  position: absolute;
  bottom: 0;
  width: 100%;
  background: var(--blue);
  height: 0%;
  transition: height 0.4s ease;
}

.footer {
  color: #6b7280;
  font-size: 14px;
}

/* Modal */
.modal {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: none;
  flex-direction: column;
  padding: 30px 20px;
}

.modal.active {
  display: flex;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.modal-title {
  font-size: 28px;
  font-weight: 700;
}

.close {
  font-size: 28px;
  cursor: pointer;
}

.glass-row {
  display: flex;
  justify-content: space-between;
  margin: 50px 0;
}

.select-glass {
  width: 90px;
  height: 140px;
  border: 3px solid var(--blue);
  border-radius: 14px;
  position: relative;
  overflow: hidden;
  cursor: pointer;
}

.select-glass.active {
  outline: 4px solid rgba(47,168,225,0.25);
}

.select-fill {
  position: absolute;
  bottom: 0;
  width: 100%;
  background: var(--blue);
}

.select-label {
  position: absolute;
  top: 10px;
  width: 100%;
  font-weight: 700;
}

.add-btn {
  margin-top: auto;
  padding: 18px;
  background: var(--blue);
  color: white;
  font-size: 18px;
  border-radius: 14px;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="container">
  <h1>HydroCamel</h1>
  <div class="subtitle">Smart hydration intelligence</div>

  <div class="amount" id="current">0 ml</div>
  <div class="goal">of 2500 ml</div>

  <img src="camel.png" class="camel" alt="camel" />

  <div class="hint">Start hydrating 💧</div>

  <div class="main-glass" id="openModal">
    <div class="main-fill" id="mainFill"></div>
  </div>

  <div class="footer">Calm · Private · Offline-friendly</div>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-header">
    <div class="modal-title">Add water</div>
    <div class="close" id="closeModal">×</div>
  </div>

  <div class="glass-row">
    <div class="select-glass" data-ml="250">
      <div class="select-fill" style="height:50%"></div>
      <div class="select-label">250 ml</div>
    </div>
    <div class="select-glass" data-ml="350">
      <div class="select-fill" style="height:70%"></div>
      <div class="select-label">350 ml</div>
    </div>
    <div class="select-glass" data-ml="500">
      <div class="select-fill" style="height:100%"></div>
      <div class="select-label">500 ml</div>
    </div>
  </div>

  <div class="add-btn" id="addWater">Add water</div>
</div>

<script>
const GOAL = 2500;
let intake = Number(localStorage.getItem("intake")) || 0;
let selected = 250;

const currentEl = document.getElementById("current");
const fillEl = document.getElementById("mainFill");

function updateUI() {
  currentEl.textContent = intake + " ml";
  fillEl.style.height = Math.min((intake / GOAL) * 100, 100) + "%";
}

updateUI();

/* Modal logic */
const modal = document.getElementById("modal");

document.getElementById("openModal").onclick = () => {
  modal.classList.add("active");
};

document.getElementById("closeModal").onclick = () => {
  modal.classList.remove("active");
};

document.querySelectorAll(".select-glass").forEach(g => {
  g.onclick = () => {
    document.querySelectorAll(".select-glass").forEach(x => x.classList.remove("active"));
    g.classList.add("active");
    selected = Number(g.dataset.ml);
  };
});

/* Default selection */
document.querySelector(".select-glass[data-ml='250']").classList.add("active");

document.getElementById("addWater").onclick = () => {
  intake = Math.min(intake + selected, GOAL);
  localStorage.setItem("intake", intake);
  updateUI();
  modal.classList.remove("active");
};
</script>

</body>
</html>
